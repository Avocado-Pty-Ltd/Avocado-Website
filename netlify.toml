# avocadodigital.com.au — Netlify configuration
#
# EzyBiz now lives at https://ezybizlex.com.au (the EzyBiz-Lex repo).
# Everything EzyBiz-related that was ever served from this domain — the old
# mirror/proxy at /ezybiz, the tradie-era landing pages, and the app's legal
# pages (terms, privacy, acceptable use, user guide, account deletion) —
# 301s to the matching page on ezybizlex.com.au so search engines and the
# app-store listings consolidate on the new domain. Nothing EzyBiz is hosted
# here any more.
#
# Rule order matters: Netlify evaluates rules top to bottom, first match
# wins, and treats `from = "/ezybiz"` as matching BOTH /ezybiz and /ezybiz/.
# The specific legal-page rules come first, then the catch-alls.

# App legal pages -> their ezybizlex.com.au equivalents. Both the .html and
# extensionless forms are covered because Netlify's pretty URLs served both.

[[redirects]]
  from = "/ezybiz-terms-of-service.html"
  to = "https://ezybizlex.com.au/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-terms-of-service"
  to = "https://ezybizlex.com.au/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-privacy-policy.html"
  to = "https://ezybizlex.com.au/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-privacy-policy"
  to = "https://ezybizlex.com.au/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-acceptable-use.html"
  to = "https://ezybizlex.com.au/acceptable-use/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-acceptable-use"
  to = "https://ezybizlex.com.au/acceptable-use/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-data-residency.html"
  to = "https://ezybizlex.com.au/data-residency/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-data-residency"
  to = "https://ezybizlex.com.au/data-residency/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-guide.html"
  to = "https://ezybizlex.com.au/user-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-guide"
  to = "https://ezybizlex.com.au/user-guide/"
  status = 301
  force = true

# ezybizlex.com.au has no standalone account-deletion page; the support page
# carries the "How do I delete my data?" FAQ, which is what the app-store
# listings need this URL for.

[[redirects]]
  from = "/ezybiz-delete-account.html"
  to = "https://ezybizlex.com.au/support/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz-delete-account"
  to = "https://ezybizlex.com.au/support/"
  status = 301
  force = true

# The old proxied product page, the mirror, and the retired tradie-era
# landing pages all land on the EzyBiz Lex homepage. The ezybiz.ai paths that
# used to be proxied under /ezybiz/ have no equivalents on the new site, so
# the splat is not carried over.

[[redirects]]
  from = "/ezybiz/*"
  to = "https://ezybizlex.com.au/"
  status = 301
  force = true

[[redirects]]
  from = "/ezybiz"
  to = "https://ezybizlex.com.au/"
