# avocadodigital.com.au — Netlify configuration
#
# EzyBiz now lives at https://lexphone.com.au (the EzyBiz-Lex repo).
# Everything EzyBiz-related that was ever served from this domain — the old
# mirror/proxy at /ezybiz, the tradie-era landing pages, and the app's legal
# pages (terms, privacy, acceptable use, user guide, account deletion) —
# 301s to the matching page on lexphone.com.au so search engines and the
# app-store listings consolidate on the new domain. Nothing EzyBiz is hosted
# here any more.
#
# Rule order matters: Netlify evaluates rules top to bottom, first match
# wins, and treats `from = "/ezybiz"` as matching BOTH /ezybiz and /ezybiz/.
# The specific legal-page rules come first, then the catch-alls.

# LEX Waypoint lives on its own subdomain, served from this site's /waypoint/
# folder. The subdomain is a domain alias on this Netlify site (DNS: CNAME
# lexwaypoint -> this site), and every path on it is rewritten into /waypoint/,
# so this rule must stay first. The page links shared assets on the main
# domain for that reason.

# The LEX Waypoint console (LEX Desktop built with the Waypoint skin, see
# scripts/build-admin-web.sh in the EzyBiz repo) is served from Firebase
# Hosting under /app/, the same way lexphone.com.au/teams proxies to
# /teams/. These two rules sit above the catch-all below. Both are 200s,
# as on lexphone.com.au: a 301 from /app to /app/ loops, because Netlify
# matches "/app" against "/app/" as well. The subdomain must be an
# authorised domain in Firebase Auth for sign-in to work here.

# lexwaypoint.com.au (registered at GoDaddy) is LEX Waypoint's own domain, a domain alias on
# this Netlify site like the subdomain below and served the same way. www goes to the apex.

[[redirects]]
  from = "https://www.lexwaypoint.com.au/*"
  to = "https://lexwaypoint.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lexwaypoint.com.au/app"
  to = "https://ezybiz-e06b6.web.app/app/"
  status = 200
  force = true

[[redirects]]
  from = "https://lexwaypoint.com.au/app/*"
  to = "https://ezybiz-e06b6.web.app/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://lexwaypoint.com.au/*"
  to = "/waypoint/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://lexwaypoint.avocadodigital.com.au/app"
  to = "https://ezybiz-e06b6.web.app/app/"
  status = 200
  force = true

[[redirects]]
  from = "https://lexwaypoint.avocadodigital.com.au/app/*"
  to = "https://ezybiz-e06b6.web.app/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://lexwaypoint.avocadodigital.com.au/*"
  to = "/waypoint/:splat"
  status = 200
  force = true

