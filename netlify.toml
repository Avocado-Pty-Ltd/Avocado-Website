# avocadodigital.com.au — Netlify configuration
#
# /ezybiz is a LIVE PROXY of https://ezybiz.ai/ (status 200 = rewrite, not
# redirect): every request under /ezybiz/ is fetched from ezybiz.ai on the
# fly, so the page can never drift from the EzyBiz site and nothing is
# duplicated in this repo. The proxied pages' relative links and assets
# (assets/…, compare-vxt.html, …) resolve under /ezybiz/ and are proxied by
# the same splat rule; their canonical tags point at ezybiz.ai, which keeps
# search signals consolidated on the .ai domain.
#
# Rule order matters: Netlify treats `from = "/ezybiz"` as matching BOTH
# /ezybiz and /ezybiz/, so the bare-path 301 below must come AFTER the splat
# rule — /ezybiz/ then hits the proxy first and never reaches the 301 (the
# Ezybiz-Website repo's netlify.toml documents the infinite loop that
# ordering avoids). The bare /ezybiz itself can't be proxied directly:
# without the trailing slash the page's relative URLs would resolve against
# the site root and 404.

[[redirects]]
  from = "/ezybiz/*"
  to = "https://ezybiz.ai/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ezybiz"
  to = "/ezybiz/"
  status = 301
  force = true

# Legacy EzyBiz URLs on this domain — the old mirror page and the retired
# tradie-era landing pages — all land on the proxied EzyBiz page.

[[redirects]]
  from = "/ezybiz.html"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/ezybiz-plumbers.html"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/ezybiz-plumbers"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/ezybiz-electricians.html"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/ezybiz-electricians"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/beta.html"
  to = "/ezybiz/"
  status = 301

[[redirects]]
  from = "/beta"
  to = "/ezybiz/"
  status = 301
